[package]
name = "honeypot"
version = "0.1.0"
edition = "2024"
description = "A modern honeypot with real-time dashboard and attack visualization"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
axum-server = { version = "0.9", features = ["tls-rustls"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "cors", "set-header"] }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }

# Hex encoding
hex = "0.4"

# GeoIP
maxminddb = "0.33"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
config = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
futures = "0.3"

# Caching
cached = { version = "4", features = ["async"] }

# ICMP capture
pnet = "0.35"

# SSH protocol
russh = "0.65"
rand = "0.10"
html-escape = "0.3"
tracing-stackdriver = "0.10"
dotenvy = "0.15"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
