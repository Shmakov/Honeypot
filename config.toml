# Server configuration
[server]
host = "0.0.0.0"
http_port = 80
https_port = 443
# Public URL for redirects (include protocol, no trailing slash)
public_url = "http://localhost"

# TLS (optional - set cert paths to enable)
tls_cert = ""
tls_key = ""
# Max ports to listen on (default: 128 for debug, 0=all for release)
# max_ports = 128

# Database
[database]
# "sqlite" or "postgres"
driver = "sqlite"
# For SQLite: path to database file
# For PostgreSQL: connection string
url = "honeypot.db"
# SQLite page cache in MB (default: 16). With cache=shared, this is the total
# shared cache across all pool connections. Set based on available server memory.
# cache_size_mb = 16
# Raw request retention in days (default: 30; 0 disables pruning). Daily rollups are kept forever.
retention_days = 30

# GeoIP database paths (MaxMind GeoLite2-City.mmdb and optional GeoLite2-ASN.mmdb)
[geoip]
database = "data/GeoLite2-City.mmdb"
asn_database = "data/GeoLite2-ASN.mmdb"

# Logging
[logging]
level = "info"

# Protocol emulation settings
[emulation]
ssh_banner = "SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.4"
ftp_banner = "220 FTP Server ready."
mysql_version = "5.7.42-0ubuntu0.18.04.1"
# Decoy hostname and persona ("ubuntu", "iot", or "db")
hostname = "prod-web-01"
persona = "ubuntu"

# Map tile settings
[map]
carto_api_key = ""

# DoS resilience & listener limits
[limits]
max_connections_per_ip = 20
max_total_connections = 2000
write_buffer_capacity = 10000
udp_enabled = true
